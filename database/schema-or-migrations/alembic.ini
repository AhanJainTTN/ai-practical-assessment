# Alembic configuration for Support Ticket Management System.
# Run from project root:
#   cd src/backend && uv run alembic -c ../../database/schema-or-migrations/alembic.ini upgrade head

[alembic]
script_location = %(here)s
prepend_sys_path = .
version_path_separator = os

sqlalchemy.url = sqlite:///./tickets.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
